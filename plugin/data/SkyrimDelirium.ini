; Skyrim Delirium settings. With SKSE Menu Framework installed they are also in game: F1, Mod Control Panel,
; Skyrim Delirium (every change applies at once and is written here by itself). Editing this file while the game runs
; is read again by itself. Presets: SKSE\Plugins\SkyrimDelirium\Presets.

[Data]
; Optional: the full path to Fred.art in your own GTA IV install (GTAIV\pc\data\naturalmotion\Fred.art), for the
; behaviour closest to GTA IV. Left empty, or if the file is not there, the mod uses its own character below.
sGTAFile=
; the mod's own character (body, joints and muscles) and how it maps onto the Skyrim skeleton, relative to the game folder
sCharacter=Data\SKSE\Plugins\SkyrimDelirium\skyrim_character.json
sRig=Data\SKSE\Plugins\SkyrimDelirium\skyrim_character_rig.txt

[Test]
; DirectX scan codes: 0x41 = F7 (push the NPC under the crosshair), 0x3C = F2 (hand every body back to Skyrim)
iPushKey=0x41
iReleaseKey=0x3C
; push strength, N s: 80 stumbles, two or three presses in a row knock the body down
fPush=80
; hand back to Skyrim's animation once the body has caught itself; a fallen body is held until Skyrim's get-up
bAutoRelease=1
; the body holds the NPC's live animation pose (guard up, gestures) instead of a fixed stance
bFollowAnimation=1

[Ragdoll]
; Delirium takes over every living NPC Skyrim puts into its ragdoll (Fus Ro Dah, pushes, explosions, other mods) until it gets up
bTakeOver=1
; Skyrim's ragdoll stays the body (its own mass, gravity, collision); Delirium follows it and its muscles turn the bodies.
; Muscle strength on Skyrim's bodies (1 = Delirium's own)
fTorqueGain=1.0
; Skyrim\'s own joint friction while Delirium drives (0 = off so the behaviours show, 1 = untouched); put back when she is let go
fJointFriction=0.0
; while Delirium drives, Skyrim's bodies weigh what Delirium's parts do (1), so its behaviours move her as in the playroom; put back when she is let go
bMatchMass=1
; and grip the ground and bounce as Delirium's parts do (1)
bMatchContact=1

[Creatures]
; these creatures react as people do, their body fitted to their own bones (0 = off: Skyrim's own reactions)
bDraugr=1
; very experimental
bSkeletons=1
; very experimental: falmer stand hunched, which Delirium can't balance yet, so only blows that put them down
; (throws, knockdowns, killing blows) are Delirium's
bFalmer=1

[Arrows]
; an arrow that hits a living NPC: Delirium's shot reaction (stumble, clutch the wound, catch herself or fall)
bShotReaction=1
; the arrow's push at the point it went in, N s (F7 is 80)
fPush=55
; under this share of health (0.2 = 20%) a hit takes her down instead of her catching herself
fWoundedBelow=0.2

[Spells]
; destruction spells' projectiles (firebolt, ice spike, lightning bolt, chain lightning, ...) hit like arrows (same push):
; frost as an arrow, fire burns on top (the arms beat at the flames), shock jolts. Streams (Flames, Sparks) are left out
bShotReaction=1
; seconds she burns / is shocked after a hit
fBurnTime=2.5
fShockTime=2.0
; channelled spells (Flames, Frostbite, Sparks): no shot, only the fire / shock / ice, for this long after the last hit (s)
fChannelLinger=0.6
; chance a spell's missile brings an NPC into Delirium when she isn't in it already, at full health / near death
; (in between by her health). Once she is in, every hit plays. A killing blow and a spell that staggers always do (1 / 1)
fStartChance=1
fStartChanceHurt=1
; the same for channelled spells, per second of channel; once in, every tick keeps her in (1 / 1)
fChannelChance=1
fChannelChanceHurt=1

[Stagger]
; every stagger Skyrim gives an NPC (a heavy blow, a shield bash, Fus, magic stagger, area staggers) is played by
; Delirium as a push: away from the attacker, harder for a stronger stagger. Skyrim's stagger still stops what she does
bReplace=1
; push for the strongest stagger (magnitude 1), N s; a light one gets fMinShare of it (F7 is 80)
fPush=90
fMinShare=0.4
; a melee blow that staggers pushes as hard as the blow ([Melee]) x (1 + fHitBoost x the stagger's magnitude)
fHitBoost=0.5
; a stagger on her feet pushes at most this, N s, in place of [Melee] / [Hits] fMaxPush (past ~200 she may fall)
fMaxPush=200

[Bump]
; running into an NPC (sprinting, fast) is played by Delirium (the stand.bump row) in place of Skyrim's stumble;
; they still step out of the way and say their line
bReplace=1
; push, N s, along your run
fPush=50
; Skyrim bumps every frame you touch: one push per run-in, a new one after this many s without contact
fRepeatAfter=1

[Bodies]
; NPCs' bodies are in Skyrim's physics world while they stand: a thrown or falling body stops against them, and a
; body that hits one hard enough is a blow on them (the stand.bump row), from a ragdoll or from an NPC Delirium has
; stumbling. 0: as before (a standing NPC is air to other bodies)
bCollide=1
; a ragdolled body is a blow on a standing NPC from this speed against them, m/s
fSpeed=2.5
; the same for an NPC Delirium has on their feet (a stagger into someone); they are pushed back as hard
fStumbleSpeed=0.8
; push per m/s the body comes at them, N s, and at most
fPush=12
fMaxPush=160
; s before the same NPC takes another blow from a body
fRepeatAfter=1.5

[Melee]
; while Delirium has her (a stagger, an arrow, a spell), every blow reacts: a light one flinches (guard up, turned to
; the attacker), a heavier one makes her step to catch it; past what she can catch she falls
bReact=1
; push for a plain blow (iron sword, 15 damage), N s; x for a power attack, a shield bash, a sneak
; attack, a blocked blow
fPush=50
fPower=2.2
fBash=1.6
fSneak=1.3
fBlocked=0.5
; heavier weapons push harder: by the square root of weight/fWeightRef, within fHeftMin-fHeftMax (dagger 0.6, iron
; sword 1, greatsword ~1.4, warhammer ~1.7)
fWeightRef=9
fHeftMin=0.6
fHeftMax=1.7
; a swing's sideways sweep bends the push (0 = straight away from the attacker); an overhead chop pushes down this much
fSwing=0.5
fChop=0.35
; blows pushing less than this flinch, harder ones step, N s
fFlinchBelow=55

; a heavy blow (power attack, heavy weapon, big damage): oomph 0 at fOomphFrom x a plain blow's push, 1 at fOomphTo.
; It snaps the head (fHeadWhip of the push at the head) and keeps her on the ground longer if she falls
fOomphFrom=1.3
fOomphTo=4.0
fHeadWhip=0.2
; a blow pushes at most this, N s (past it the stagger, flailing and fall carry it: one big shove looks limp)
fMaxPush=160

[Explosions]
; an explosion (Fireball, runes, explosive arrows) pushes everyone it catches away from its centre, with the element's
; reaction on top: fPush N s at the centre for a [Hits] fDamageRef-damage explosion, fFarShare of it at the edge, its
; upward part fUp (0 flat)
bPush=1
fPush=90
fFarShare=0.4
fUp=0.25
; it throws her: fFlySpeed m/s at the centre for fDamageRef damage (x the damage scale, x fFarShare-1 by nearness),
; fFlyUp m/s up per m/s along, capped at fFlyMax; under fFlyMin she only takes the push. In the air her arms windmill
; and legs pedal (or she rolls up), and she reaches to catch the fall coming down
fFlySpeed=3.0
fFlyUp=0.65
fFlyMin=2.0
fFlyMax=9.0
; from fHighFallAt m/s she is thrown far (Delirium's highFall, its own arms and legs and catch); a push of fTumble N s
; per m/s at the head tumbles her
fHighFallAt=4.5
fTumble=10

[Falls]
; an NPC who drops more than fHighFallDrop m off a ledge falls in Delirium: arms out, legs ready, lands into a
; ragdoll and Skyrim's get-up (Skyrim's fall damage unchanged)
bHighFall=1
fHighFallDrop=3.0

[Down]
; knocked down (thrown, or a heavy blow): she writhes on the ground fWritheTime + fWritheAdd x oomph s (half for a
; blow), or curls up (fFoetalChance), before she lies still and Skyrim gets her up
fWritheTime=1.0
fWritheAdd=1.2
fFoetalChance=0.3

[Hits]
; arrows, spells, melee and staggers push harder for a harder hit, the same for everyone: fDamageRef damage pushes at
; 1x, twice the damage 2^fExponent as hard (1.74x at 0.8), within fScaleMin-fScaleMax
fDamageRef=15
fExponent=0.8
fScaleMin=0.4
fScaleMax=3.0
; a hit past a plain one jolts harder on top (arrows, spells): oomph goes 0-1 as the damage scale above goes
; fOomphFrom-fOomphTo; the shot twists her x(1 + fOomphSpin x oomph) and pushes x(1 + fOomphPush x oomph)
fOomphFrom=1.0
fOomphTo=2.5
fOomphSpin=2.0
fOomphPush=1.0
; a spell's or arrow's push at most, N s (past it one shove knocks her over limp; the shot and flailing carry it)
fMaxPush=150
; share of a standing hit's push that goes to the pelvis instead of the part hit (blows too): the whole body is
; driven back into catch steps instead of folding at the waist (0: all at the part hit)
fPelvisShare=0
; most catch steps a shot (any standing hit) takes before she stops stepping; Delirium's default is 6
iMaxSteps=10

[Collision]
; the body collides with Skyrim's own world collision (floors, stairs, walls, terrain, rocks, trees) instead of a flat floor
bWorldCollision=1
; how far around the NPC to take it, game units (70 = 1 m), sideways and up/down
fRadius=600
fHeight=300
iMaxTriangles=40000

[Deaths]
; Skyrim's killmoves off (the KillMove global; a save keeps it: `set killmove to 1` brings them back) (1)
bNoKillMoves=1
; kill cams off (fKillCamBaseOdds 0, bVATSDisable) (1)
bNoKillCams=1
; seconds a killed NPC may die on her feet in Delirium (wounded, staggering, collapsing) before she goes down for
; good; sooner once she is down (3, 0 = no dying on her feet)
fDyingTime=3
; the killing blow kills at once (events, loot, AI off); she stumbles on as Skyrim's ragdoll held exactly to
; Delirium's pose until she is down. 0 = the old way: kept alive at 1 health until she collapses (1)
bDieAtOnce=1
; dying on her feet: seconds she fights to stay up before she collapses (0.8 / 1.6)
fCollapseAfterMin=0.8
fCollapseAfterMax=1.6
; the killing blow as Delirium's shot at this health (0 = fatal: every muscle off in 0.5 s, a flop; under 100 = wounded, falls) (70)
fDyingHealth=70
; seconds until the corpse goes limp (1.8 / 3.0)
fLimpAfterMin=1.8
fLimpAfterMax=3.0
; chance of a weak writhe on the ground first (0.5), of the arms going out to break the fall (0.5)
fWritheChance=0.5
fCatchFallChance=0.5
; m/s away from the killer as she dies, in place of Skyrim's own death motion (it lunges toward him) (1.5)
fDeathPush=1.5
; m/s cap on any body as she dies (Skyrim's death throws limbs at 17 m/s) (6)
fDeathMaxSpeed=6
; seconds the dying shot (reaching for the wound, breaking the fall) plays before a writhe (1.2)
fShotTime=1.2

[Reactions]
; The reaction table. A blow picks the most exact row: phase.type.strength, then phase.strength, phase.type, phase.
; Phases: stand; fly, downhit, down and die below. Types: melee, arrow, spell, blast, stagger, knock, shout, other.
; (melee: every melee hit, the ones that stagger too: power attacks, bashes. stagger: a stagger with no melee hit
;  behind it: an enemy recoiling off your block, a stagger spell or effect, an explosion's stagger.)
; (knock: Skyrim knocked her down itself, a shout, a trap, a script: fly.knock(.far) rows when it throws her.)
; Strength: light (push under [Melee] fFlinchBelow), heavy (oomph from fHeavyOomph), lethal (the killing blow), else none.
; Shouts go by words instead: stand.shout.word1, .word2, .word3 (Fus, Fus Ro, Fus Ro Dah); throw:m/s on one throws,
; but only a shout that staggers as hard as Fus Ro Dah does (a stagger effect of 1.5+: Skyrim's knock-down); others
; take the row without the throw (Fire Breath's last word stays on its feet).
; (stand.lethal also sets the shot health and collapse of a death with no blow: fire, a fall, the console.)
; A row is a base behaviour, then layers, comma-separated; name:value gives a number.
;   bases:  shot[:health] (Delirium's shot task; health 100+ stays up, under 100 hurt and falls; default from her health)
;           flinch (guard up, turned to the attacker; with no attacker: step), step (balance, catch it), none (push only)
;   layers: spin (the jolt twists the spine, harder hits more), headsnap[:x] (the head snaps back), push:x (push x),
;           collapse (lethal: stops fighting it and goes down), burn[:s], shock[:s], chill[:s] (the element on top)
;           throw[:m/s] (thrown along the blow as an explosion throws, default 6; then the fly rows)
; fire / shock / frost rows: the layers every blow of that element gets.
fHeavyOomph=0.5
stand=step
stand.melee=shot, spin, headsnap
stand.melee.light=flinch
stand.arrow=shot, spin, headsnap
stand.spell=shot, spin, headsnap
stand.stagger.light=flinch
stand.blast.light=flinch
stand.lethal=shot:150, spin, headsnap, collapse
stand.shout.word1=step
stand.shout.word2=step, push:2
stand.shout.word3=step, throw:9
stand.bump=step
fire=burn
shock=shock
frost=
; die (as she dies): die.held(.element) after dying on her feet, else die.element, die.type, die (her last blow).
;   By default from [Deaths]: die=shot:<fDyingHealth>, push, catch:<fCatchFallChance>, writhe:<fWritheChance>; die.held=writhe:<fWritheChance>
;   shot[:health] (the dying shot; none: no shot), push[:x] (fDeathPush x), catch:chance (arms out to break the fall),
;   writhe:chance (a weak writhe on the ground before limp), amp:x, period:s (that writhe's size and s per cycle)
;   e.g. die.fire=shot:40, push, writhe:1, amp:1.6, period:1.5
; fly (thrown): fly.element.far, fly.element, fly.type.far, fly.type, fly.far (from [Explosions] fHighFallAt), fly. Elements: arrow, frost, fire, shock, magic.
;   choices, by weight: windmill (arms windmill, legs pedal, spine writhes), rollup (rolled up, legs pedal), highfall, foetal (curled, legs kick)
;   layers: thrash (the windmill's spine thrashes, as on fire), shock (electrocuted), tumble:x (the head-first tumble x)
; downhit (a hit while down): downhit.type, downhit. react (she reacts on the ground; none: only moved), push:x, time:x (how long)
; down (how she reacts once down): down.element, down. By default down follows [Down] fFoetalChance (foetal, else 60% writhe, 40% roll).
;   choices, by weight: writhe, roll (writhing, rolling over), foetal (curled up), still
;   layers: amp:x, period:x (the writhe's size and s per cycle; else from how hard), shock (convulsing), shiver
fly=foetal:50, windmill:30, rollup:20
fly.far=foetal:45, highfall:35, windmill:10, rollup:10
fly.fire=foetal:75, windmill:25, thrash
downhit=react, push:0.6
downhit.melee=react, push:0.6, time:0.8
down.arrow=writhe
down.magic=writhe
down.fire=roll, amp:2.2, period:0.4
down.shock=writhe, amp:1.3, period:0.3, shock
down.frost=foetal, shiver
fly.shout=foetal:50, windmill:30, rollup:20
fly.shout.far=highfall:60, foetal:25, windmill:15
